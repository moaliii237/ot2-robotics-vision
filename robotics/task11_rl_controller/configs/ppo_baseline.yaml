# Baseline PPO config for the OT-2 Gym env.
#
# To run with this config:
#     python train_rl.py --experiment_name "PPO_baseline" --total_timesteps 1000000
#         --learning_rate 3e-4 --batch_size 64 --n_steps 2048 \
#         --gamma 0.99 --gae_lambda 0.95 --clip_range 0.2 --n_epochs 10 \
#         --net_arch "64,64" --n_envs 4

learning_rate: 3.0e-4
batch_size: 64
n_steps: 2048
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
n_epochs: 10
ent_coef: 0.0
vf_coef: 0.5
max_grad_norm: 0.5
net_arch: "64,64"
total_timesteps: 1000000
n_envs: 4
max_episode_steps: 400
success_threshold_mm: 1.0
dwell_steps: 20
